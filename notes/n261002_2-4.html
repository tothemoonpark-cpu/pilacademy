        @media(max-width:520px){.ph-grid{grid-template-columns:1fr;}.ph-cell img{height:200px;}}

      /* [2026-08-26] 기관 그리드 — 온담 파트너 로고 밴드 벤치마킹.
         ⛔ 38개교·기관이 문장 속에 묻혀 있었다. 이름을 한 화면에 펼쳐 규모가 보이게 한다. */
      .org-band{padding:2.8rem 1.5rem;background:#fff;border-top:1px solid var(--line,#ececec);}
      .org-inner{max-width:1032px;margin:0 auto;}
      .org-head{text-align:center;margin-bottom:1.5rem;}
      .org-head b{display:block;font-size:1.25rem;font-weight:700;letter-spacing:-0.02em;color:var(--ink,#16181d);}
      .org-head span{display:block;font-size:0.88rem;color:var(--sub,#5b6066);margin-top:0.35rem;}
      .org-group{margin-bottom:1.5rem;}
      .org-label{font-size:0.8rem;font-weight:700;color:var(--mint-dark,#1f9d93);margin-bottom:0.6rem;letter-spacing:0.02em;text-align:center;}
      .org-chips{display:flex;flex-wrap:wrap;justify-content:center;gap:0.4rem;}
      .org-chips span{display:inline-block;font-size:0.88rem;color:var(--sub,#5b6066);
        background:var(--panel,#f7f8f9);border:1px solid var(--line,#ececec);
        border-radius:999px;padding:0.32rem 0.78rem;line-height:1.4;white-space:nowrap;}
      .org-chips span.hi{background:#eefaf7;border-color:#bfe6e1;color:#1f9d93;font-weight:700;}
      .org-note{text-align:center;font-size:0.8rem;color:var(--muted,#9aa0a6);margin-top:0.9rem;line-height:1.6;}
        
        /* [2026-08-26] 고정 퀵바 — 온담 벤치마킹 OD-8
           ⭐ 온담은 전 페이지에 「문의하기·강사영상·칼럼보기」 3버튼을 고정 노출한다.
              하단 CTA 밴드까지 못 내려간 방문자를 잡는 장치다.
           ⛔ 3개만 둔다(전역지침 「한 화면에 강조 3개」). 모바일에서는 하단 가로 바로 바뀐다. */
        .pil-quick{position:fixed;right:14px;bottom:22px;z-index:900;display:flex;flex-direction:column;gap:8px;}
        .pil-quick a{display:flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line,#ececec);
          border-radius:999px;padding:0.62rem 0.95rem;font-size:0.8rem;font-weight:600;color:var(--ink,#16181d);
          text-decoration:none;box-shadow:0 4px 16px rgba(0,0,0,0.11);white-space:nowrap;transition:transform .15s;}
        .pil-quick a:hover{transform:translateY(-2px);}
        .pil-quick a.hi{background:var(--mint,#2bb7ac);color:#fff;border-color:var(--mint,#2bb7ac);}
        .pil-quick svg{width:15px;height:15px;flex:0 0 auto;}
        @media(max-width:760px){
          .pil-quick{right:0;left:0;bottom:0;flex-direction:row;gap:0;border-top:1px solid var(--line,#ececec);
            background:#fff;padding:0.45rem 0.5rem calc(0.45rem + env(safe-area-inset-bottom));}
          .pil-quick a{flex:1;justify-content:center;box-shadow:none;border:none;border-radius:14px;font-size:0.8rem;padding:0.55rem 0.3rem;}
          .pil-quick a.hi{border-radius:14px;}
        }
